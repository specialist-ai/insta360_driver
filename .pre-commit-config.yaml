# Runs locally on commit and in CI (see .github/workflows/ci.yml).
# clang-format uses .clang-format; sdk/ is vendored and never touched.
repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.3
    hooks:
      - id: clang-format
        exclude: '^sdk/'
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '^sdk/'
      - id: end-of-file-fixer
        exclude: '^sdk/'
      - id: check-yaml
      - id: check-merge-conflict
